name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'

  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1 - UNIT TEST
  # ============================================================
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ============================================================
  # JOB 2 - TRAIN
  # ============================================================
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest

    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate AWS
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: |
          dvc pull data/train_batch1.csv.dvc
          dvc pull data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          echo "F1 score: $F1"

      - name: Upload candidate model to AWS S3
        run: |
          python - <<'PYEOF'
          import boto3

          bucket = "${{ secrets.ARTIFACT_BUCKET }}"
          s3 = boto3.client("s3", region_name="us-east-1")

          s3.upload_file(
              "models/model.joblib",
              bucket,
              "artifacts/candidate/model.joblib"
          )

          s3.upload_file(
              "outputs/report.json",
              bucket,
              "artifacts/candidate/report.json"
          )

          print("Candidate model and report uploaded.")
          PYEOF

      - name: Save reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
            outputs/thresholds.json


  # ============================================================
  # JOB 3 - QUALITY GATE
  # ============================================================
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}

        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = 0.65

          print(f"F1 score: {f1:.4f}")
          print(f"Threshold: {threshold}")

          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: F1={f1:.4f} < {threshold}"
              )

          print(
              f"PASSED: F1={f1:.4f} >= {threshold}"
          )
          PYEOF


  # ============================================================
  # JOB 4 - REGRESSION GATE
  # ============================================================
  regression-gate:
    name: Regression Gate
    needs: [train, quality-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate AWS
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: Compare and promote model
        env:
          NEW_F1: ${{ needs.train.outputs.f1 }}

        run: |
          python - <<'PYEOF'
          import boto3
          import json
          import os

          from botocore.exceptions import ClientError

          bucket = "${{ secrets.ARTIFACT_BUCKET }}"
          new_f1 = float(os.environ["NEW_F1"])

          s3 = boto3.client(
              "s3",
              region_name="us-east-1"
          )

          current_f1 = None

          try:
              obj = s3.get_object(
                  Bucket=bucket,
                  Key="artifacts/current/report.json"
              )

              current_report = json.loads(
                  obj["Body"].read().decode("utf-8")
              )

              current_f1 = float(
                  current_report["f1_score"]
              )

          except ClientError as e:
              error_code = e.response["Error"]["Code"]

              if error_code not in (
                  "NoSuchKey",
                  "404",
              ):
                  raise

          print(f"Candidate F1: {new_f1:.4f}")

          if current_f1 is not None:
              print(f"Current F1: {current_f1:.4f}")

              if new_f1 < current_f1:
                  raise SystemExit(
                      "Regression detected: "
                      f"{new_f1:.4f} < {current_f1:.4f}. "
                      "Deployment blocked."
                  )

              # Luu phien ban current thanh previous
              s3.copy_object(
                  Bucket=bucket,
                  CopySource={
                      "Bucket": bucket,
                      "Key": "artifacts/current/model.joblib",
                  },
                  Key="artifacts/previous/model.joblib",
              )

              s3.copy_object(
                  Bucket=bucket,
                  CopySource={
                      "Bucket": bucket,
                      "Key": "artifacts/current/report.json",
                  },
                  Key="artifacts/previous/report.json",
              )

          else:
              print(
                  "No current report found; "
                  "bootstrapping current model."
              )

          # Promote candidate thanh current
          s3.copy_object(
              Bucket=bucket,
              CopySource={
                  "Bucket": bucket,
                  "Key": "artifacts/candidate/model.joblib",
              },
              Key="artifacts/current/model.joblib",
          )

          s3.copy_object(
              Bucket=bucket,
              CopySource={
                  "Bucket": bucket,
                  "Key": "artifacts/candidate/report.json",
              },
              Key="artifacts/current/report.json",
          )

          print("Candidate promoted to current.")
          PYEOF


  # ============================================================
  # JOB 5 - RELEASE
  # ============================================================
  release:
    name: Release
    needs: regression-gate
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH key
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.SERVER_SSH_KEY }}

        run: |
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub

          echo "GitHub secret key fingerprint:"
          ssh-keygen -lf /tmp/deploy_key.pub

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            sudo systemctl restart income-api

            sleep 5

            sudo systemctl is-active --quiet income-api

            curl --fail http://127.0.0.1:8080/healthz

            echo ""
            echo "Health check passed."