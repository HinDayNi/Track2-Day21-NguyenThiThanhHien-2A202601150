release:
  name: Release
  needs: quality-gate
  runs-on: ubuntu-latest

  steps:
    - name: Verify SSH key
      shell: bash
      run: |
        printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' > /tmp/deploy_key
        chmod 600 /tmp/deploy_key

        ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub

        echo "GitHub secret key fingerprint:"
        ssh-keygen -lf /tmp/deploy_key.pub

    - name: SSH deploy to VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo systemctl restart income-api
          sleep 5
          curl --fail http://127.0.0.1:8080/healthz
          echo "Health check passed."