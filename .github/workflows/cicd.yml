name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'

  workflow_dispatch:

jobs:

  # ============================================================
  # JOB 1 - UNIT TEST
  # ============================================================
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ============================================================
  # JOB 2 - TRAIN
  # ============================================================
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest

    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate AWS
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=us-east-1" >> "$GITHUB_ENV"

      - name: Pull data with DVC
        run: |
          dvc pull data/train_batch1.csv.dvc
          dvc pull data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          echo "F1 score: $F1"

      - name: Upload model to AWS S3
        run: |
          python - <<'PYEOF'
          import boto3
          import os

          bucket = "${{ secrets.ARTIFACT_BUCKET }}"

          s3 = boto3.client(
              "s3",
              region_name="us-east-1"
          )

          s3.upload_file(
              "models/model.joblib",
              bucket,
              "artifacts/current/model.joblib"
          )

          print(
              f"Uploaded model to "
              f"s3://{bucket}/artifacts/current/model.joblib"
          )
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ============================================================
  # JOB 3 - QUALITY GATE
  # ============================================================
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}

        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = 0.65

          print(f"F1 score: {f1:.4f}")
          print(f"Threshold: {threshold}")

          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: F1={f1:.4f} < {threshold}"
              )

          print(
              f"PASSED: F1={f1:.4f} >= {threshold}"
          )
          PYEOF


  # ============================================================
  # JOB 4 - RELEASE
  # ============================================================
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH key
        shell: bash
        run: |
          printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh-keygen -y \
            -f /tmp/deploy_key \
            > /tmp/deploy_key.pub

          echo "GitHub secret key fingerprint:"
          ssh-keygen -lf /tmp/deploy_key.pub

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            sudo systemctl restart income-api

            sleep 5

            sudo systemctl is-active --quiet income-api

            curl --fail http://127.0.0.1:8080/healthz

            echo ""
            echo "Health check passed."